name: Deploy

on:
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://335227.snk.wtf:8443
      VPS_HOST: 335227.snk.wtf
      VPS_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIACfcUR3uraDu23YL9/j7nqvl7FL4gqLMnEWzV5pRYuq

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies (Yarn 1)
        run: yarn --frozen-lockfile
      - name: Build client
        run: yarn workspace @trgames/client build
        env:
          VITE_API_BASE_URL: ${{ env.SITE_URL }}
      - name: Build server
        run: yarn workspace @trgames/server build
      - name: Pack
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir bundle
          cp -r client/dist bundle/www
          cp server/dist/server.js deploy/compose.yml bundle/
          printf 'OPENROUTER_API_KEY=%s\nCORS_ORIGIN=%s\n' "$OPENROUTER_API_KEY" "$SITE_URL" > bundle/.env
      - name: Upload to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_HOST $VPS_HOST_KEY" > ~/.ssh/known_hosts
          install -m 600 /dev/null ~/.ssh/deploy
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy
          tar czf - -C bundle . | ssh -i ~/.ssh/deploy root@"$VPS_HOST"
