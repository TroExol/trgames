name: Lint PR

on:
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (Yarn 1)
        run: yarn --frozen-lockfile
      - name: Run linter
        run: yarn lint
